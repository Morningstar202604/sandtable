name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 运行测试
        run: python -m pytest -q
      - name: 密钥泄漏扫描
        run: |
          ! git grep -inE "sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}" -- . ':!*.md' ':!.env*'
